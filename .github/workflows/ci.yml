name: checks
on: [push, pull_request]
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Skill checks
        run: python3 scripts/check_kit.py
      - name: Kit checker tests
        run: python3 -m unittest tests/test_check_kit.py
      - name: Editor rule tests
        run: cd agent-editor && python3 -m unittest tests/test_ops.py
